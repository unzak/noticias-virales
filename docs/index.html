<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Radar de noticias actualizado automáticamente con GitHub Actions.">
  <title>Radar viral</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">ACTUALIZACIÓN AUTOMÁTICA</p>
      <h1>Radar viral</h1>
      <p class="subtitle">Noticias recientes ordenadas por actualidad.</p>
    </div>
    <div class="status" aria-live="polite">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Cargando datos…</span>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="Información de actualización">
      <div><strong>Última actualización</strong><span id="updated">—</span></div>
      <div><strong>Noticias</strong><span id="count">—</span></div>
      <button id="reload" type="button">Actualizar vista</button>
    </section>

    <section id="stories" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>No hay noticias disponibles en este momento.</p>
  </main>

  <footer>
    Generado automáticamente mediante GitHub Actions y publicado en GitHub Pages.
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
