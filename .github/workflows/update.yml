name: Actualizar y publicar radar viral

on:
  schedule:
    # GitHub Actions interpreta el cron en UTC.
    # Se ejecuta cada 15 minutos, evitando el minuto 0 para reducir retrasos.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fetch_news.py'
      - 'tools/**'
      - 'cabronazi_performance_profile.json'
      - 'editorial_selection_profile.json'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile fetch_news.py tools/build_cabronazi_profile.py

      - name: Generar ranking viral
        run: python fetch_news.py

      - name: Comprobar JSON generado
        run: python -m json.tool docs/data.json > /dev/null

      - name: Mostrar diagnóstico
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Cron: ${{ github.event.schedule }}"
          echo "Hora UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Hora Madrid: $(TZ=Europe/Madrid date +'%Y-%m-%dT%H:%M:%S%z')"
          cat docs/last-update.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
