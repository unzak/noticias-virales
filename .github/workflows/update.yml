name: Actualizar y publicar radar viral

on:
  # Sin `schedule`: la actualización periódica la dispara un cronjob externo
  # (cron-job.org) cada quince minutos, llamando a la API de Actions.
  #
  # El scheduler de GitHub resultó inservible para este panel: en cinco días
  # entregó entre 31 y 45 ejecuciones de las 48 pedidas, y llegó a estar 13
  # horas seguidas sin lanzar ninguna. Ningún run falló nunca: sencillamente
  # no se disparaban. Los eventos `schedule` son de baja prioridad y GitHub
  # los retrasa o los descarta sin aviso ni garantía.
  #
  # Al no haber respaldo dentro de GitHub, si el cronjob externo se detiene
  # —por ejemplo al caducar su token— el panel deja de actualizarse hasta que
  # alguien lo dispare a mano. La alerta de fallo de cron-job.org es el único
  # aviso; conviene mantenerla activada.
  workflow_dispatch:

  workflow_call:

  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fetch_news.py'
      - 'cabronazi_performance_profile.json'
      - 'editorial_selection_profile.json'
      - 'tools/build_cabronazi_profile.py'
      - 'tools/fetch_forocoches_trending.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Serializa generación y despliegue para que cada ejecución pueda fusionar el
# history.json publicado por la anterior sin perder noticias entre carreras.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    name: Generar y empaquetar el radar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Opcionales. El panel sigue funcionando sin estas claves.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile fetch_news.py tools/build_cabronazi_profile.py tools/fetch_forocoches_trending.py

      - name: Generar ranking viral
        run: python fetch_news.py

      - name: Comprobar JSON generado
        run: |
          python -m json.tool docs/data.json > /dev/null
          python -m json.tool docs/history.json > /dev/null

      - name: Comprobar previsualizaciones enlazadas
        run: |
          python -c "import json, urllib.parse; d=json.load(open('docs/data.json', encoding='utf-8')); s=d.get('stories', []); u=d.get('unfiltered_stories', []); f=d.get('forocoches_stories', []); assert all(not x.get('thumbnail') or str(x['thumbnail']).startswith(('http://', 'https://')) or str(x['thumbnail']) == 'media/forocoches.svg' for x in s + u + f), 'Hay una imagen no permitida'; assert all('news.google.' not in (urllib.parse.urlparse(str(x.get('link', ''))).hostname or '') for x in s + u), 'Hay noticias sin resolver al artículo original'; assert len(u) == int(d.get('temporal_summary', {}).get('accepted', -1)), 'Sin filtro no contiene todas las piezas válidas'; assert all(x.get('main_platform') == 'forocoches' and x.get('thumbnail') == 'media/forocoches.svg' for x in f), 'La vista ForoCoches contiene fichas inválidas'; print(f'Selección: {len(s)} · Sin filtro: {len(u)} · ForoCoches: {len(f)}')"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: Publicar en GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
