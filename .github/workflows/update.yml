name: Actualizar y publicar noticias trending

on:
  # Cada 45 minutos, desplazado del minuto 0 para reducir retrasos por carga.
  schedule:
    - cron: '7 0,3,6,9,12,15,18,21 * * *'
    - cron: '52 0,3,6,9,12,15,18,21 * * *'
    - cron: '37 1,4,7,10,13,16,19,22 * * *'
    - cron: '22 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fetch_news.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Generar ranking de noticias
        run: python fetch_news.py

      - name: Comprobar JSON generado
        run: python -m json.tool docs/data.json > /dev/null

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
