name: Actualizar y publicar radar viral

on:
  # Cada 45 minutos, desplazado del minuto 0 para reducir retrasos por carga.
  schedule:
    - cron: '7 0,3,6,9,12,15,18,21 * * *'
    - cron: '52 0,3,6,9,12,15,18,21 * * *'
    - cron: '37 1,4,7,10,13,16,19,22 * * *'
    - cron: '22 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fetch_news.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Opcionales. El panel sigue funcionando sin estas claves.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile fetch_news.py

      - name: Generar ranking viral
        run: python fetch_news.py

      - name: Comprobar JSON generado
        run: python -m json.tool docs/data.json > /dev/null

      - name: Comprobar previsualizaciones locales
        run: |
          test -d docs/media
          echo "Imágenes almacenadas: $(find docs/media -maxdepth 1 -type f | wc -l)"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
