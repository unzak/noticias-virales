name: Actualizar y publicar radar viral

oon:
  schedule:
    # Cuatro eventos separados para poder comprobar cuál omite GitHub.
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fetch_news.py'
      - 'cabronazi_performance_profile.json'
      - 'editorial_selection_profile.json'
      - 'tools/build_cabronazi_profile.py'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    name: Generar y empaquetar el radar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Opcionales. El panel sigue funcionando sin estas claves.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

    steps:
      - name: Diagnóstico del disparo
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Cron recibido: ${{ github.event.schedule }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Hora UTC de inicio: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile fetch_news.py tools/build_cabronazi_profile.py

      - name: Generar ranking viral
        run: python fetch_news.py

      - name: Comprobar JSON generado
        run: python -m json.tool docs/data.json > /dev/null

      - name: Comprobar previsualizaciones enlazadas
        run: |
          python -c "import json, urllib.parse; d=json.load(open('docs/data.json', encoding='utf-8')); s=d.get('stories', []); u=d.get('unfiltered_stories', []); assert all(not x.get('thumbnail') or str(x['thumbnail']).startswith(('http://', 'https://')) for x in s + u), 'Hay una imagen que no es remota'; assert all('news.google.' not in (urllib.parse.urlparse(str(x.get('link', ''))).hostname or '') for x in s), 'Hay noticias curadas sin resolver al artículo original'; assert len(u) == int(d.get('temporal_summary', {}).get('accepted', -1)), 'Sin filtro no contiene todas las piezas válidas'; print(f'Selección: {len(s)} · Sin filtro: {len(u)}')"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: Publicar en GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Solo el despliegue se serializa. La generación de la siguiente ejecución
    # puede comenzar aunque el despliegue anterior todavía esté terminando.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
