name: Actualizar radar viral · turnos intercalados

on:
  schedule:
    # Turnos 2 y 4 de cada hora, intercalados con los de update.yml para que
    # los cuatro disparos queden repartidos cada quince minutos: :11, :26,
    # :41 y :56. Ver update.yml para por qué se declaran cuatro y no dos.
    - cron: '26,56 * * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    uses: ./.github/workflows/update.yml
    secrets: inherit
